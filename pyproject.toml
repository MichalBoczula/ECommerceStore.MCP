[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ecommerce-store-mcp"
version = "0.1.0"
description = "MCP tools for the ECommerce Store."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "httpx2>=2.13,<3",
    "mcp>=2.3,<3",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "starlette>=1,<2",
]

[project.scripts]
ecommerce-store-mcp = "ecommerce_store_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ecommerce_store_mcp"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.uv]
required-version = "==0.12.18"
